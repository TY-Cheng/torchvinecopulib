[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://ty-cheng.github.io/torchvinecopulib/"
repository = "https://github.com/TY-Cheng/torchvinecopulib"
documentation = "https://ty-cheng.github.io/torchvinecopulib/"
changelog = "https://github.com/TY-Cheng/torchvinecopulib/blob/main/CHANGELOG.md"
issues = "https://github.com/TY-Cheng/torchvinecopulib/issues"

[project]
name = "torchvinecopulib"
version = "1.3.0"
requires-python = ">=3.11"
authors = [{ name = "Tuoyuan Cheng", email = "tuoyuan.cheng@nus.edu.sg" }]
description = "Fitting and sampling vine copulas using PyTorch."
readme = "README.md"
keywords = ["vine copula", "copula", "torch", "conditional simulation"]
classifiers = [
    # "Private :: Do Not Upload",
    "License :: OSI Approved :: MIT License",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2", "scipy"]

[dependency-groups]
dev = [
    "coverage",
    "flake8",
    "hypothesis",
    "matplotlib",
    "mypy",
    "networkx",
    "pytest-cov",
    "pytest",
    "ruff",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx-design",
    "sphinx_pyproject",
    "sphinx",
]
examples = [
    "blitz-bayesian-pytorch",
    "pandas",
    "pytorch-lightning",
    "python-dotenv",
    "scikit-learn",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
cpu = ["torch>=2"]
cu126 = ["torch>=2"]
cu128 = ["torch>=2"]
reference = ["pyvinecopulib"]

[tool.uv]
managed = true
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cu126", extra = "cu126" },
    { index = "torch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 99

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 99

[tool.ruff.lint.pycodestyle]
max-doc-length = 99
max-line-length = 99

[tool.flake8]
max-line-length = 127
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist", "docs"]
per-file-ignores = [
    "torchvinecopulib/vinecop/__init__.py: E501",
    "torchvinecopulib/bicop/__init__.py: E501",
    "torchvinecopulib/util/__init__.py: E501",
]

[tool.pytest.ini_options]
markers = [
    "cuda: tests that require a CUDA device and are skipped in the default CPU suite",
    "integration: tests that exercise fit/serialize/reload/sample workflows end-to-end",
    "property: hypothesis-driven statistical property tests",
    "reference: tests that rely on optional reference implementations",
    "slow: long-running tests that are excluded from the default fast feedback loop",
]

[tool.sphinx-pyproject]
source-dir = "docs"
build-dir = "docs/_build"
all_files = true
extensions = [
    "myst_parser",
    "sphinx.ext.autodoc",
    "sphinx.ext.autosectionlabel",
    "sphinx.ext.autosummary",
    "sphinx.ext.coverage",
    "sphinx.ext.doctest",
    "sphinx.ext.extlinks",
    "sphinx.ext.githubpages",
    "sphinx.ext.graphviz",
    "sphinx.ext.ifconfig",
    "sphinx.ext.imgconverter",
    "sphinx.ext.inheritance_diagram",
    "sphinx.ext.intersphinx",
    "sphinx.ext.mathjax",
    "sphinx.ext.napoleon",
    "sphinx.ext.todo",
    "sphinx.ext.viewcode",
]
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
html_theme = "furo"
